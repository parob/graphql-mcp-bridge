name: Deploy to Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-bridge
  cancel-in-progress: false

env:
  PROJECT_ID: graphql-mcp
  REGION: europe-west1
  SERVICE: graphql-mcp-bridge

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - name: Install deps
        run: uv sync
      - name: Lint
        run: uv run flake8 bridge tests
      - name: Tests
        run: uv run pytest -q

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Deploy
        run: |
          gcloud run deploy "$SERVICE" \
            --source . \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --allow-unauthenticated \
            --max-instances=1 \
            --min-instances=0 \
            --concurrency=80 \
            --memory=512Mi \
            --cpu=1 \
            --timeout=300 \
            --set-env-vars=COMMIT_SHA=${{ github.sha }} \
            --quiet
